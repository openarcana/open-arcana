name: Validate dataset and exports

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional Parquet reader when needed
        if: hashFiles('exports/*.parquet') != ''
        run: python3 -m pip install pyarrow
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build.py --check-exports
